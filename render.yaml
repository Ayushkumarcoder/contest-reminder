services:
  # Backend Service
  - type: web
    name: contest-reminder-api
    env: node
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: contest-reminder-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: contest-reminder-db
    plan: free
    databaseName: contest_reminder
    user: contest_user

version: "1"
